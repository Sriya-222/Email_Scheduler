version: '3.8'

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reachinbox_scheduler
      MYSQL_USER: scheduler
      MYSQL_PASSWORD: scheduler_pw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=scheduler
      - DB_PASSWORD=scheduler_pw
      - DB_NAME=reachinbox_scheduler
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=production_secret_key_change_me
      - WORKER_CONCURRENCY=5
      - MIN_DELAY_BETWEEN_EMAILS_MS=2000
      - MAX_EMAILS_PER_HOUR=200
    ports:
      - "4000:4000"
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
